# Собирает APK через Capacitor и кладёт его в Releases.
name: APK
on:
  push:
    branches: [main]
    paths: ['www/**', 'assets/**', 'package.json', 'capacitor.config.json', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Зависимости
        run: npm install --no-audit --no-fund
      - name: Android-проект
        run: npx cap add android
      - name: Иконки и заставка
        continue-on-error: true
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#EEF5F4' --iconBackgroundColorDark '#0C2430'
          --splashBackgroundColor '#EEF5F4' --splashBackgroundColorDark '#0C2430'
      - name: Синхронизация
        run: npx cap sync android
      - name: Постоянный ключ подписи
        # Один и тот же ключ — чтобы новые версии ставились поверх старой и прогресс не терялся.
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: Сборка
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Переименование
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mora-pnina.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mora-pnina-apk
          path: mora-pnina.apk
      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Мора Пнина, сборка ${{ github.run_number }}
          body: Скачай mora-pnina.apk на телефон и установи. Новая версия ставится поверх старой, прогресс сохраняется.
          files: mora-pnina.apk
          make_latest: true
