# Собирает APK через Capacitor и кладёт его в Releases.
name: APK
on:
  push:
    branches: [main]
    paths: ['www/**', 'assets/**', 'package.json', 'capacitor.config.json', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Зависимости
        run: npm install --no-audit --no-fund
      - name: Android-проект
        run: npx cap add android
      - name: Иконки и заставка
        continue-on-error: true
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#EEF5F4' --iconBackgroundColorDark '#0C2430'
          --splashBackgroundColor '#EEF5F4' --splashBackgroundColorDark '#0C2430'
      - name: Синхронизация
        run: npx cap sync android
      - name: Постоянный ключ подписи
        # Один и тот же ключ — чтобы новые версии ставились поверх старой и прогресс не терялся.
        # Прописываем ключ прямо в сборку: ~/.android/debug.keystore Gradle на раннере игнорирует.
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../keystore/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE
      - name: Сборка
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Переименование
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mora-pnina.apk
      - name: Проверка подписи
        # Если подпись не совпала с ключом из keystore/, сборка падает и в релиз ничего не уходит.
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs mora-pnina.apk | tee signature.txt
          grep -qi "SHA-256 digest: b1e34a8c8c7ca12611825ef4bfb9effecc8e406afe78ad92afff693abfa34427" signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mora-pnina-apk
          path: mora-pnina.apk
      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Мора Пнина, сборка ${{ github.run_number }}
          body: Скачай mora-pnina.apk на телефон и установи. Новая версия ставится поверх старой, прогресс сохраняется.
          files: mora-pnina.apk
          make_latest: true
