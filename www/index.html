<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мора Пнина — иврит для первых недель</title>
<meta name="theme-color" content="#0B5873">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Пнина">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script>window.PNINA_PWA=true;</script>
<style>.hefont{font-family:"Frank Ruhl Libre","Times New Roman",serif}

:root{
  --bg:#EEF5F4; --surface:#FFFFFF; --ink:#16303A; --muted:#5B7480;
  --sea:#0B5873; --pepper:#C8243B; --cat:#6E9F4E; --line:#CFE0E0; --soft:#DCEBEA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C2430; --surface:#12313F; --ink:#E4EFEF; --muted:#93AEB7;
    --sea:#8ED2E6; --pepper:#FF6F7F; --cat:#8CBF68; --line:#24495A; --soft:#173B4B;
  }
}
:root[data-theme="dark"]{
  --bg:#0C2430; --surface:#12313F; --ink:#E4EFEF; --muted:#93AEB7;
  --sea:#8ED2E6; --pepper:#FF6F7F; --cat:#8CBF68; --line:#24495A; --soft:#173B4B;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:620px;margin:0 auto;padding:16px 18px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px;border-radius:6px}

header{display:flex;align-items:center;gap:12px;padding:6px 0 14px;border-bottom:1px solid var(--line)}
header .name{font-weight:700;font-size:20px;line-height:1.1}
header .name bdi{font-family:"Frank Ruhl Libre","Times New Roman",serif;color:var(--sea);font-weight:700;margin-left:6px}
header .count{font-size:14px;color:var(--muted)}
header .count b{color:var(--sea)}
nav{display:flex;gap:4px;margin:12px 0 18px;flex-wrap:wrap}
nav button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-size:15px}
nav button[aria-current="true"]{background:var(--soft);color:var(--ink);font-weight:500}
nav .spacer{flex:1}
.toggle{border:1px solid var(--line)!important;font-size:14px!important}
.toggle[aria-pressed="true"]{border-color:var(--sea)!important;color:var(--sea)!important}

.scene{display:flex;gap:12px;align-items:flex-start}
.cat{flex:0 0 56px;width:56px;height:56px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 16px;flex:1;min-width:0}
.lines p{margin:0 0 10px}
.lines p:last-child{margin-bottom:0}
.lines p.fresh{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.lines p.fresh{animation:none}}

.w{font-family:"Frank Ruhl Libre","Times New Roman",serif;font-weight:700;color:var(--sea);font-size:1.18em;
  cursor:pointer;border-radius:4px;padding:0 1px}
.w:hover{background:var(--soft)}
.w.form{text-decoration:underline dotted var(--pepper);text-decoration-thickness:2px;text-underline-offset:5px}
ruby rt{font-family:"Rubik",sans-serif;font-weight:400;font-size:.52em;color:var(--muted);letter-spacing:.02em}
.intro{cursor:pointer;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--cat) 35%,transparent) 62%)}
.intro rt{font-family:"Frank Ruhl Libre",serif;font-size:.7em;color:var(--pepper);font-weight:700}
.name-tok{cursor:pointer;border-bottom:1px dashed var(--muted)}
p.flip{font-family:"Frank Ruhl Libre",serif;font-size:1.25em;text-align:right}
p.flip .w{font-size:1em}
.flipmeta{display:block;font-family:"Rubik",sans-serif;font-size:13px;color:var(--muted);text-align:left;margin-top:2px}
.flipmeta button{background:none;border:0;padding:0;color:var(--sea);font-size:13px;text-decoration:underline}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{background:var(--sea);color:var(--bg);border:0;border-radius:12px;padding:12px 20px;font-weight:500}
.btn.ghost{background:none;color:var(--sea);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.reply{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.reply button{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 18px;
  font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:22px;color:var(--sea)}
.reply button:hover{border-color:var(--sea)}
.reply rt{font-size:.5em}
.prompt{color:var(--muted);font-size:15px;margin:16px 0 0}

h2{font-size:22px;font-weight:700;margin:4px 0 6px;line-height:1.25}
.sub{color:var(--muted);margin:0 0 16px}

.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card .big{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:44px;line-height:1.1;color:var(--sea);direction:rtl;text-align:right}
.card .tr{color:var(--muted)}
.card .ru{font-weight:500;font-size:19px}
.card ul{margin:8px 0 0;padding-left:18px;font-size:15px;color:var(--muted)}
.card ul bdi{font-family:"Frank Ruhl Libre",serif;font-weight:700;color:var(--sea);font-size:1.15em}

.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.q .ask{font-size:15px;color:var(--muted);margin:0 0 6px}
.q .target{font-size:28px;font-weight:500;margin:0 0 16px}
.q .target.he{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:48px;color:var(--sea);direction:rtl;text-align:right;line-height:1.15}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:56px}
.opts button.he{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:26px;color:var(--sea)}
.opts button.right{border-color:#2E8B57;background:color-mix(in srgb,#2E8B57 14%,var(--bg))}
.opts button.wrong{border-color:var(--pepper);background:color-mix(in srgb,var(--pepper) 12%,var(--bg))}
.feedback{margin:14px 0 0;font-size:15px}
.progress{height:6px;background:var(--soft);border-radius:3px;margin:0 0 16px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--cat);border-radius:3px;transition:width .2s}

.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.row .he{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:24px;color:var(--sea);min-width:80px;text-align:right}
.row .meta{flex:1;min-width:0}
.row .meta small{display:block;color:var(--muted);font-size:13px}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--cat)}
.row.locked{opacity:.5}
.row button{background:none;border:0;padding:0;text-align:left;flex:1}

.sheet-bg{position:fixed;inset:0;background:rgba(5,20,28,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:20px 20px 0 0;padding:20px 22px calc(22px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .big{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:48px;color:var(--sea);direction:rtl;text-align:right;line-height:1.1}
.sheet .tr{color:var(--muted)}
.sheet .note{margin-top:12px;padding:10px 12px;border-left:3px solid var(--pepper);background:var(--bg);border-radius:0 10px 10px 0;font-size:15px}
.sheet .note bdi{font-family:"Frank Ruhl Libre",serif;font-weight:700;color:var(--sea);font-size:1.2em}
.sheet .close{margin-top:14px}

.settings{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.settings button{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;margin:6px 6px 0 0;color:var(--muted)}
.empty{color:var(--muted)}
.log{display:grid;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:2px}
.msg .bubble p{margin:0}
.msg.n .av{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--sea);display:grid;place-items:center;font-weight:700;margin-left:8px}
.msg.n .bubble{border-color:var(--sea);border-radius:4px 18px 18px 18px}
.msg.me{justify-content:flex-end}
.msg.me .bubble{flex:0 1 auto;background:var(--sea);color:var(--bg);border-color:var(--sea);border-radius:18px 4px 18px 18px;text-align:right}
.msg.me .w{color:var(--bg)}
.msg.me rt{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.msg.fresh{animation:pop .25s ease-out}
@media (prefers-reduced-motion: reduce){.msg.fresh{animation:none}}
.cat.sm{flex:0 0 40px;width:40px;height:40px;margin-left:8px}
.gl{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:1.15em;color:var(--ink);cursor:pointer;
  text-decoration:underline dotted var(--muted);text-underline-offset:5px}
.slot{font-family:"Rubik",sans-serif;font-weight:500;font-size:.8em;color:var(--pepper)}
.choice{margin-top:12px;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:14px}
.choice .hint{font-size:15px;color:var(--muted);margin:0 0 10px}
.choice .reply{margin-top:0}
.reply button{text-align:right}
.reply button small{display:block;font-family:"Rubik",sans-serif;font-weight:400;font-size:13px;color:var(--muted);text-align:left;direction:ltr}
.reply button:disabled{opacity:.4;cursor:default}
.say{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--sea)}
.group{margin:18px 0 8px;font-weight:500}
.opts button small{display:block;font-family:"Rubik",sans-serif;font-size:12px;color:var(--muted);font-weight:400}
.sit{font-size:20px;font-weight:500;margin:0 0 16px}
.ktav{font-family:"Playpen Sans Hebrew","Frank Ruhl Libre",serif;font-weight:500;color:var(--sea)}
.ktavline{display:flex;align-items:baseline;gap:10px;justify-content:flex-end;margin:2px 0 4px}
.ktavline span{font-size:12px;color:var(--muted)}
.ktavline .ktav{font-size:30px;line-height:1.3}
.row .he{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.row .he .ktav.small{font-size:17px;font-weight:400}
.inl{font-family:"Frank Ruhl Libre",serif;font-weight:700;color:var(--sea);font-size:1.15em}
.abcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.abc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;display:grid;grid-template-columns:1fr 1fr;align-items:center;row-gap:2px}
.abc .pr{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:34px;color:var(--ink)}
.abc .ktav{font-size:34px}
.abc .nm,.abc small{grid-column:1/3;direction:ltr}
.abc .nm{font-size:14px;font-weight:500}
.abc small{font-size:11px;color:var(--muted);line-height:1.3}
/* режим «всё от руки» */
.ktav-all .w,.ktav-all .gl,.ktav-all .hefont,.ktav-all .intro rt,.ktav-all .inl,.ktav-all .sheet .big,.ktav-all .card .big,.ktav-all .note bdi,.ktav-all .card ul bdi{font-family:"Playpen Sans Hebrew","Frank Ruhl Libre",serif!important;font-weight:500!important}
.signwrap{margin-top:8px}
.sign{display:inline-block;font-family:"Rubik",Arial,sans-serif!important;font-weight:700!important;font-size:26px;line-height:1.2;padding:8px 18px;border-radius:6px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.sign.sm{font-size:17px;padding:4px 10px}
.sg-exit{background:#1E8E3E;color:#fff}
.sg-info{background:#1F4E8C;color:#fff}
.sg-shop{background:#FFD23F;color:#B3001B;border-radius:999px}
.sg-warn{background:#FFC400;color:#111;border:3px solid #111}
.sg-door{background:#fff;color:#111;border:2px solid #9AA}
.sg-label{background:#fff;color:#0B5873;border:2px dashed #0B5873;border-radius:12px}
.sg-taxi{background:#111;color:#FFD23F}
.sign-cap{font-size:13px;color:var(--muted);margin-top:4px}
.qsign{margin:0 0 16px;text-align:right}
.qsign .sign{font-size:36px;padding:12px 26px}
.sc{color:var(--pepper)!important}
.who-btn{white-space:nowrap}
.newp label{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
.newp label small{font-size:12px}
.newp textarea{display:block;width:100%;font:13px/1.4 monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.newp input{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gsel{display:flex;gap:8px;margin:4px 0}
.gsel button{flex:1;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px}
.gsel button[aria-checked="true"]{border-color:var(--sea);color:var(--sea);font-weight:500}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheet"></div>
<div id="toast" hidden style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:90%;font-size:14px;z-index:20"></div>
<script>
/* ===== Фразы и слова =====
   kind: p — фраза, w — слово. ___ — место для подстановки.
   when — ситуация, по которой проверяется фраза. */
const ITEMS = {
  shalom:{he:'שָׁלוֹם',tr:'шало́м',ru:'привет / пока',day:1,kind:'w'},
  toda:{he:'תּוֹדָה',tr:'тода́',ru:'спасибо',day:1,kind:'w'},
  bevakasha:{he:'בְּבַקָּשָׁה',tr:'бевакаша́',ru:'пожалуйста / не за что / проходите',day:1,kind:'w'},
  slicha:{he:'סְלִיחָה',tr:'слиха́',ru:'извините / простите',day:1,kind:'w'},
  ken:{he:'כֵּן',tr:'кен',ru:'да',day:1,kind:'w'},
  lo:{he:'לֹא',tr:'ло',ru:'нет / не',day:1,kind:'w'},

  lomevina:{he:'אֲנִי לֹא מְבִינָה',tr:'ани́ ло мевина́',ru:'я не понимаю',day:2,kind:'p',when:'Тебе быстро что-то сказали, и ты не {поняла|понял} ни слова.',note:'Женская форма. Мужчина скажет אֲנִי לֹא מֵבִין (ани ло меви́н).',m:{he:'אֲנִי לֹא מֵבִין',tr:'ани́ ло меви́н',note:'Мужская форма. Женщина скажет אֲנִי לֹא מְבִינָה (мевина́).'}},
  leat:{he:'אֶפְשָׁר יוֹתֵר לְאַט?',tr:'эфша́р йоте́р леа́т?',ru:'можно помедленнее?',day:2,kind:'p',when:'Человек говорит слишком быстро.'},
  odpaam:{he:'עוֹד פַּעַם, בְּבַקָּשָׁה',tr:'од па́ам, бевакаша́',ru:'ещё раз, пожалуйста',day:2,kind:'p',when:'Ты не {расслышала|расслышал} и хочешь, чтобы повторили.'},
  medaber:{he:'אַתָּה מְדַבֵּר ___?',tr:'ата́ медабе́р ___?',ru:'вы говорите ___? (к мужчине)',day:2,kind:'p',when:'Хочешь узнать у мужчины, говорит ли он на другом языке.',note:'В иврите на «ты» со всеми, а форма зависит от пола собеседника. К женщине: אַתְּ מְדַבֶּרֶת ___?'},
  anglit:{he:'אַנְגְּלִית',tr:'англи́т',ru:'английский',day:2,kind:'w'},
  rusit:{he:'רוּסִית',tr:'руси́т',ru:'русский',day:2,kind:'w'},
  lomedet:{he:'אֲנִי לוֹמֶדֶת עִבְרִית',tr:'ани́ ломе́дет иври́т',ru:'я учу иврит',day:2,kind:'p',when:'Объясняешь, почему говоришь медленно и с ошибками.',note:'Женская форма. Мужчина скажет אֲנִי לוֹמֵד עִבְרִית (ломе́д).',m:{he:'אֲנִי לוֹמֵד עִבְרִית',tr:'ани́ ломе́д иври́т',note:'Мужская форма. Женщина скажет אֲנִי לוֹמֶדֶת עִבְרִית (ломе́дет).'}},

  kama:{he:'כַּמָּה זֶה עוֹלֶה?',tr:'ка́ма зе оле́?',ru:'сколько это стоит?',day:3,kind:'p',when:'На товаре нет ценника.'},
  efshar:{he:'אֶפְשָׁר ___, בְּבַקָּשָׁה?',tr:'эфша́р ___, бевакаша́?',ru:'можно ___, пожалуйста?',day:3,kind:'p',when:'Просишь, чтобы тебе что-то дали.',note:'Универсальная рамка: подставляй любое слово. Работает в кафе, в магазине, в банке.'},
  yeshlachem:{he:'יֵשׁ לָכֶם ___?',tr:'еш лахе́м ___?',ru:'у вас есть ___?',day:3,kind:'p',when:'Не {нашла|нашёл} товар и спрашиваешь, бывает ли он у них.'},
  zehu:{he:'זֶהוּ, תּוֹדָה',tr:'зе́hу, тода́',ru:'это всё, спасибо',day:3,kind:'p',when:'Спрашивают, нужно ли что-то ещё. Не нужно.'},
  shakit:{he:'שַׂקִּית',tr:'саки́т',ru:'пакет',day:3,kind:'w'},
  mayim:{he:'מַיִם',tr:'ма́йим',ru:'вода',day:3,kind:'w'},
  ashrai:{he:'אַשְׁרַאי',tr:'ашра́й',ru:'кредитка, «картой?»',day:3,kind:'w'},

  eifo:{he:'אֵיפֹה ___?',tr:'эйфо́ ___?',ru:'где ___?',day:4,kind:'p',when:'Ищешь, где что-то находится.'},
  sherutim:{he:'שֵׁרוּתִים',tr:'шеру́тим',ru:'туалет',day:4,kind:'w'},
  tachana:{he:'תַּחֲנָה',tr:'тахана́',ru:'остановка, станция',day:4,kind:'w'},
  nosea:{he:'זֶה נוֹסֵעַ לְ___?',tr:'зе носэ́а ле___?',ru:'это едет в ___?',day:4,kind:'p',when:'Подошёл автобус или поезд, и ты проверяешь, туда ли он едет.',note:'לְ — «в / к», приклеивается к названию: לְחֵיפָה, לְתֵל אָבִיב.'},
  ravkav:{he:'רַב־קַו',tr:'рав-ка́в',ru:'Рав-Кав, проездная карта',day:4,kind:'w'},

  achat:{he:'אַחַת',tr:'аха́т',ru:'один / одна',day:5,kind:'w'},
  shtayim:{he:'שְׁתַּיִם',tr:'шта́им',ru:'два / две',day:5,kind:'w'},
  shalosh:{he:'שָׁלוֹשׁ',tr:'шало́ш',ru:'три',day:5,kind:'w'},
  chamesh:{he:'חָמֵשׁ',tr:'хаме́ш',ru:'пять',day:5,kind:'w'},

const KEY='pilpel-v3', OLDKEY='pilpel-phrases-v1';
function defaults(){ return {profiles:{}, active:null, offset:0, nikud:true, translit:true, ktav:false, updated:0}; }
function newProfile(name, heName, gender){ return {name, heName:heName||'', gender, words:{}, done:[], lastDone:null, scolds:[]}; }
let state=defaults();
try{
  const raw=localStorage.getItem(KEY);
  if(raw) state=Object.assign(defaults(), JSON.parse(raw));
  else { const old=localStorage.getItem(OLDKEY); if(old){ const o=JSON.parse(old);
    const pr=newProfile('Ученица','', 'f'); Object.assign(pr,{words:o.words||{},done:o.done||[],lastDone:o.lastDone||null});
    state.profiles.p1=pr; state.active='p1'; ['offset','nikud','translit','ktav'].forEach(k=>{ if(k in o) state[k]=o[k]; }); } }
}catch(e){}
const P=()=>state.profiles[state.active];
const gen=()=>P()?P().gender:'f';
let db=null, uid=null, chain=Promise.resolve(), lastRemote='';
function save(){
  state.updated=Date.now(); const json=JSON.stringify(state);
  try{ localStorage.setItem(KEY,json); }catch(e){}
  if(db&&uid&&json!==lastRemote){ chain=chain.then(()=>db.doc('data/users/'+uid+'/pilpel-v3').set({state:json})).then(()=>{lastRemote=json;}).catch(()=>{}); }
}

const G=t=>t?t.replace(/\{([^{}|]*)\|([^{}]*)\}/g,(m,f,mm)=>gen()==='m'?mm:f):t;
const gv=o=>gen()==='m'&&o.m?Object.assign({},o,o.m):o;
const NIK=/[\u0591-\u05BD\u05BF\u05C1\u05C2\u05C4\u05C5\u05C7]/g;
function plainHe(he){ return he.split(/(\s+)/).map(w=>{ const core=w.replace(/[?!.,«»]/g,''); const f=FIX[core]; return f?w.replace(core,f):w.replace(NIK,''); }).join(''); }
const fmt=he=>state.nikud?he:plainHe(he);
const dots=s=>s.replace('___','…');
let pops=[];
function R(ref){
  if(ref[0]==='~') return Object.assign({gloss:true},gv(GLOSS[ref]));
  if(ref[0]==='!'){ const k=ref.slice(1); return Object.assign({scold:true,key:k},gv(SCOLDS[k])); }
  if(ref==='@me'){ const p=P(); return {name:true, he:p.heName, tr:p.heName?'':p.name, ru:p.name}; }
  if(ref[0]==='@') return Object.assign({name:true},NAMES[ref]);
  const [k,f]=ref.split(':'); const it=gv(ITEMS[k]);
  if(f){ const F=FORMS[f]; return {he:F.he,tr:F.tr,ru:F.ru,note:F.note,base:it,key:k,form:f,when:it.when}; }
  return {he:it.he,tr:it.tr,ru:it.ru,note:it.note,key:k,when:it.when,kind:it.kind};
}
const keyOf=ref=>ref.split(':')[0];
const isItem=ref=>ref&&!'~@!'.includes(ref[0]);
function build(ref, fillRef, fillRu, forceHe){
  const i=R(ref); let html=fmt(i.he), tr=i.tr, plain=i.he, fill=null;
  if(i.he.includes('___')){
    if(fillRef) fill=R(fillRef);
    const fillHe=fill&&fill.he&&(forceHe||fill.name||known(keyOf(fillRef)));
    const [a,b]=i.he.split('___'); const [ta,tb]=i.tr.split('___');
    plain=fill&&fill.he?a+fill.he+b:a+' '+b;
    if(fillHe){ html=fmt(a)+fmt(fill.he)+fmt(b); tr=ta+fill.tr+tb; }
    else { const w=fillRu||(fill?fill.ru:'…'); html=fmt(a)+`<bdi dir="ltr" lang="ru" class="slot">${w}</bdi>`+fmt(b); tr=ta+w+tb; }
  }
  return {info:i, fill, html, tr, plain};
}
function optBuild(t){
  const parts=t.split('+').map(p=>{ const [ref,fillRef,fillRu]=p.split('|'); return build(ref,fillRef||null,fillRu||null,true); });
  if(parts.length===1) return parts[0];
  return {info:{ru:parts.map(p=>p.info.ru).join(' + ')}, html:parts.map(p=>p.html).join(' ')+'?', tr:parts.map(p=>p.tr).join(' ')+'?',
    plain:parts.map(p=>p.plain).join(' ')+'?', fill:null, multi:parts};
}
function optKeys(t){ const ks=[]; t.split('+').forEach(p=>{ const [ref,fr]=p.split('|'); if(isItem(ref)) ks.push(keyOf(ref)); if(isItem(fr)) ks.push(keyOf(fr)); }); return ks; }
function heTok(b, cls){
  const idx=pops.push(b)-1;
  const inner=state.translit&&b.tr?`<ruby>${b.html}<rt>${b.tr}</rt></ruby>`:b.html;
  return `<bdi dir="rtl" lang="he" class="${cls}" data-i="${idx}" tabindex="0" role="button">${inner}</bdi>`;
}
const hasScold=k=>P().scolds.includes(k);
function mixed(text, intro){
  return G(text).replace(/\[([^\]]+)\]/g,(m,inner)=>{
    const [ru,ref,fillRef,fillRu]=inner.split('|');
    if(ref[0]==='@') return ru;
    if(ref[0]==='!') return hasScold(ref.slice(1))?heTok(build(ref),'w sc'):ru;
    const b=build(ref,fillRef,fillRu,false);
    if(ref[0]==='~') return heTok(b,'gl');
    const k=keyOf(ref);
    if(known(k)) return heTok(b,'w'+(b.info.form?' form':''));
    if(intro&&intro.has(k)){ const bb=build(ref,fillRef,fillRu,true); bb.isNew=true; const idx=pops.push(bb)-1;
      return `<ruby class="intro" data-i="${idx}" tabindex="0" role="button">${ru}<rt lang="he">${bb.html}</rt></ruby>`; }

}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function poolFor(key, kind, maxDay){
  const avail=Object.keys(ITEMS).filter(k=>k!==key&&ITEMS[k].day<=maxDay);
  let p=shuffle(avail.filter(k=>ITEMS[k].kind===kind));
  if(p.length<3) p=p.concat(shuffle(avail.filter(k=>ITEMS[k].kind!==kind&&(kind!=='s'||true))));

}
function makeQ(key, type){

  if(cur&&cur.choice){
    below=`<div class="choice"><p class="hint">${mixed(cur.choice.prompt,intro)}</p><div class="reply">${cur.choice.opts.map((o,i)=>{
      const b=optBuild(o.t); const unknown=optKeys(o.t).some(k=>!known(k));
      const gloss=unknown?`<small>${G(b.info.ru)}${state.translit?' · '+b.tr:''}</small>`:(state.translit?`<small>${b.tr}</small>`:'');
      return `<button class="hefont" data-opt="${i}" lang="he" ${sc.tried.has(i)?'disabled':''}>${b.html}${gloss}</button>`; }).join('')}</div></div>`;
  } else if(cur) below=`<div class="actions"><button class="btn" data-act="more">Дальше</button></div>`;
  else if(recap) below=`<div class="actions"><button class="btn" data-act="torecapend">К новой сцене</button></div>`;
  else below=`<div class="actions"><button class="btn" data-act="cards">Разобрать новое</button></div>`;
  const head=recap?`<h2>Вспоминаем: ${G(ep.recapTitle)}</h2><p class="sub">Сцена на уже знакомые фразы. Первый ответ на каждый ход засчитывается как повторение.</p>`
    :`<h2>День ${ep.n}. ${ep.title}</h2><p class="sub">Нажми на слово на иврите, чтобы услышать его и увидеть перевод. Серые с пунктиром — то, что говорят тебе: их достаточно узнавать.</p>`;
  return head+`<div class="log">${log}</div>${below}`;
}
function formsOf(k){ return Object.values(FORMS).filter(f=>f.base===k); }
function ktavLine(he){ return `<div class="ktavline"><span>от руки</span><bdi dir="rtl" lang="he" class="ktav">${fmt(dots(he))}</bdi></div>`; }
function noteHTML(t){ return G(t).replace(/[\u0590-\u05FF][\u0590-\u05FF\s־]*[\u0590-\u05FF]|[\u0590-\u05FF]/g, m=>`<bdi dir="rtl" lang="he" class="hefont inl">${fmt(m)}</bdi>`); }
function itemCard(k){
  const it=gv(ITEMS[k]), fs=formsOf(k), sign=it.kind==='s';
  return `<div class="card">${sign?`<div style="text-align:right">${signHTML(k,false)}</div><p class="sub" style="margin:8px 0 0">Так на вывеске. С огласовками: <bdi dir="rtl" lang="he" class="hefont inl">${it.he}</bdi></p>`:`<div class="big hefont" lang="he">${fmt(dots(it.he))}</div>${ktavLine(it.he)}`}
   <div class="ru">${G(it.ru)}</div><div class="tr">${dots(it.tr)}</div>
   ${it.when?`<p style="margin:8px 0 0;font-size:15px">Когда: ${G(it.when)}</p>`:''}
   ${it.note?`<p style="margin:6px 0 0;font-size:15px;color:var(--muted)">${noteHTML(it.note)}</p>`:''}
   ${fs.length?`<ul>${fs.map(f=>`<li><bdi dir="rtl" lang="he" class="hefont">${fmt(dots(f.he))}</bdi> — ${f.ru}</li>`).join('')}</ul>`:''}
   <div style="margin-top:10px"><button class="say" data-say="${it.he.replace('___','')}">Послушать</button></div></div>`;
}
function cardsHTML(){
  const ph=S.ep.items.filter(k=>ITEMS[k].kind!=='s'), sg=S.ep.items.filter(k=>ITEMS[k].kind==='s');
  return `<h2>Новое за день</h2><p class="sub">После проверки всё это будет на иврите во всех сценах — и в новых, и в старых.</p>
   <div class="cards">${ph.map(itemCard).join('')}</div>
   ${sg.length?`<p class="group">Вывески</p><div class="cards">${sg.map(itemCard).join('')}</div>`:''}
   <div class="actions"><button class="btn" data-act="quiz">Проверить себя</button></div>`;
}
function doneHTML(){
  const log=stepsToLog(S.ep.steps).slice(-6); const last=!nextEpisode();
  return `<h2>${last?'Курс пройден':'День '+S.ep.n+' пройден'}</h2><p class="sub">${last?'Две недели, около сотни фраз, слов и вывесок. Повторения будут приходить и дальше.':'Так эта сцена выглядит теперь:'}</p>
   <div class="log">${log.map(e=>msgHTML(e,null,false)).join('')}</div>
   <div class="actions"><button class="btn" data-nav="home">Готово</button><button class="btn ghost" data-nav="book">Разговорник</button></div>`;
}
function bookHTML(){
  const row=k=>{ const it=gv(ITEMS[k]), w=W()[k], lvl=w?w.lvl:0, fs=formsOf(k);
    const he=it.kind==='s'?`<span class="sign sm sg-${it.sg}" lang="he" dir="rtl">${signText(k)}</span>`:`<span class="hefont">${fmt(dots(it.he))}</span><span class="ktav small">${fmt(dots(it.he))}</span>`;
    return `<div class="row"><div class="he" lang="he" dir="rtl">${he}</div>
     <div class="meta">${G(it.ru)}<small>${dots(it.tr)}${fs.length?' · '+fs.map(f=>`<bdi dir="rtl" lang="he" class="hefont">${fmt(dots(f.he))}</bdi> ${f.ru}`).join(', '):''}${lvl===0?' · забылось, пока по-русски':''}</small></div>
     <button class="say" data-say="${it.he.replace('___','')}" aria-label="Послушать">▶</button>
     <div class="dots" title="Уровень ${lvl}">${[1,2,3,4,5].map(i=>`<i class="${i<=lvl?'on':''}"></i>`).join('')}</div></div>`; };
  const groups=EPISODES.map(ep=>{
    if(!P().done.includes(ep.n)) return `<p class="group" style="color:var(--muted)">День ${ep.n}. ${ep.title} — откроется позже</p>`;
    return `<p class="group">День ${ep.n}. ${ep.title}</p><div class="list">${ep.items.map(row).join('')}</div>`;
  }).join('');
  return `<h2>Разговорник</h2><p class="sub">Всё выученное по ситуациям: печатными буквами, от руки и на вывесках. Точки — сколько раз подряд ты вспомнил${gen()==='m'?'':'а'} фразу.</p>${groups}`;
}
function archiveHTML(){
  return `<h2>Сцены</h2><p class="sub">Пройденные сцены показываются с тем, что ты знаешь сейчас.</p><div class="list">${EPISODES.map(e=>{
    const open=P().done.includes(e.n);
    return `<div class="row ${open?'':'locked'}">${open?`<button data-read="${e.n}"><b>День ${e.n}.</b> ${e.title}${e.recap?`<small style="display:block;color:var(--muted);font-size:13px">и повторение: ${G(e.recapTitle)}</small>`:''}</button>`:`<div class="meta"><b>День ${e.n}.</b> откроется позже</div>`}</div>`; }).join('')}</div>`;
}
function readHTML(){
  const e=EPISODES.find(x=>x.n===readEp);
  return `<h2>День ${e.n}. ${e.title}</h2><div class="log">${stepsToLog(e.steps).map(m=>msgHTML(m,null,false)).join('')}</div>
   ${e.recap?`<h2 style="margin-top:28px">Повторение: ${G(e.recapTitle)}</h2><div class="log">${stepsToLog(e.recap).map(m=>msgHTML(m,null,false)).join('')}</div>`:''}
   <div class="actions"><button class="btn ghost" data-nav="archive">К сценам</button></div>`;
}
function abcHTML(){
  const cell=([l,n,s])=>`<div class="abc"><div class="pr hefont" lang="he">${l}</div><div class="ktav" lang="he">${l}</div><div class="nm">${n}</div><small>${s}</small></div>`;
  return `<h2>Алфавит</h2><p class="sub">Слева печатная буква, справа — как её пишут от руки. Рукописные буквы бывают совсем не похожи на печатные, их стоит выучить отдельно. Пишут справа налево.</p>
   <div class="abcgrid" dir="rtl">${ABC.map(cell).join('')}</div>
   <p class="group">Конечные формы — пишутся только в конце слова</p>
   <div class="abcgrid" dir="rtl">${FINALS.map(cell).join('')}</div>`;
}
function collHTML(){
  const all=Object.keys(SCOLDS), got=P().scolds;
  return `<h2>Коллекция ругательств</h2><p class="sub">Пнина ругается, когда ты ошибаешься. Каждое новое ругательство попадает сюда, а потом появляется в сценах уже на иврите. Собрано ${got.length} из ${all.length}.</p>
   <div class="list">${all.map(k=>{ if(!got.includes(k)) return `<div class="row locked"><div class="he">???</div><div class="meta">Ещё не слышно<small>Ошибайся смелее</small></div></div>`;
     const b=build('!'+k); return `<div class="row"><div class="he hefont" lang="he" dir="rtl">${b.html}</div><div class="meta">${G(SCOLDS[k].ru)}<small>${b.tr}</small></div>
     <button class="say" data-say="${b.plain}" aria-label="Послушать">▶</button></div>`; }).join('')}</div>`;
}
function render(){
  pops=[]; let m='';
  document.documentElement.classList.toggle('ktav-all', !!state.ktav);
  if(!P()&&view!=='profiles') view='profiles';
  if(view==='profiles') m=profilesHTML();
  else if(view==='home') m=homeHTML();
  else if(view==='review') m=qHTML(S.review[S.ri],'Ещё пара фраз',S.review.length,S.ri);
  else if(view==='scene') m=sceneHTML();
  else if(view==='cards') m=cardsHTML();
  else if(view==='quiz') m=qHTML(S.quiz[S.qi],'Проверка',S.quiz.length,S.qi);
  else if(view==='done') m=doneHTML();
  else if(view==='book') m=bookHTML();
  else if(view==='archive') m=archiveHTML();
  else if(view==='read') m=readHTML();
  else if(view==='abc') m=abcHTML();
  else if(view==='coll') m=collHTML();
  document.getElementById('app').innerHTML=headerHTML()+m;
}
function scrollEnd(){ const r=window.matchMedia('(prefers-reduced-motion: reduce)').matches; window.scrollTo({top:document.body.scrollHeight,behavior:r?'auto':'smooth'}); }

function openSheet(b){
  const i=b.info; let note='';
  if(i.sign) note+=`<div class="note">На вывеске: <bdi dir="rtl" lang="he">${signText(i.key)}</bdi>. Вывески пишут без огласовок${ITEMS[i.key].s?', и часто с лишними ו или י, чтобы слово читалось однозначно':''}.</div>`;
  if(i.form) note+=`<div class="note">Форма от <bdi dir="rtl" lang="he">${fmt(dots(i.base.he))}</bdi> («${G(i.base.ru)}»).<br>${noteHTML(i.note)}</div>`;
  else if(i.note) note+=`<div class="note">${noteHTML(i.note)}</div>`;
  if(i.gloss) note+=`<div class="note">Так говорят тебе. Учить не обязательно — главное узнавать.</div>`;
  if(i.scold) note+=`<div class="note">Из коллекции ругательств Пнины.</div>`;
  if(b.isNew) note+=`<div class="note">Новое — выучишь сегодня.</div>`;
  if(b.fill&&!b.fill.name) note+=`<div class="note">В пропуск подставлено: <bdi dir="rtl" lang="he">${fmt(b.fill.he)}</bdi> — ${G(b.fill.ru)}.</div>`;
  if(b.multi) note+=`<div class="note">${b.multi.map(p=>`<bdi dir="rtl" lang="he">${p.html}</bdi> — ${G(p.info.ru)}`).join('<br>')}</div>`;
  const he=b.html.replace(/<bdi[^>]*>(.*?)<\/bdi>/g,'$1');
  document.getElementById('sheet').innerHTML=`<div class="sheet-bg" data-close><div class="sheet" role="dialog" aria-modal="true">
   <div class="big hefont" lang="he">${he}</div>${ktavLine(b.plain)}<div class="tr">${b.tr||''}</div><div style="font-size:19px;font-weight:500">${G(i.ru)}</div>${note}
   <div class="actions"><button class="say" data-say="${b.plain}">Послушать</button><button class="btn ghost" data-close>Закрыть</button></div></div></div>`;
  document.querySelector('.sheet [data-close].btn').focus();
}
const closeSheet=()=>document.getElementById('sheet').innerHTML='';

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.i!==undefined){ e.preventDefault(); openSheet(pops[+e.target.dataset.i]); }
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-say],[data-close],[data-i],[data-nav],[data-set],[data-act],[data-pick],[data-opt],[data-read],[data-g],[data-switch]');
  if(!t) return; const d=t.dataset;
  if(d.say!==undefined){ speak(d.say); return; }
  if(d.close!==undefined){ if(e.target===t||t.tagName==='BUTTON') closeSheet(); return; }
  if(d.i!==undefined){ openSheet(pops[+d.i]); return; }
  if(d.g){ newGender=d.g; document.querySelectorAll('[data-g]').forEach(b=>b.setAttribute('aria-checked', String(b.dataset.g===newGender))); return; }
  if(d.switch){ state.active=d.switch; S=null; save(); view='home'; render(); return; }
  if(d.nav){ view=d.nav; if(view==='home'||view==='profiles') S=null; resetArmed=false; render(); window.scrollTo(0,0); return; }
  if(d.set){ state[d.set]=!state[d.set]; save(); render(); return; }
  if(d.read){ readEp=+d.read; view='read'; render(); window.scrollTo(0,0); return; }
  if(d.opt!==undefined){
    const sc=S.sc, s=sc.steps[sc.pos], o=s.choice.opts[+d.opt];
    if(sc.kind==='recap'&&sc.first){ srsFromChoice(s,o); sc.first=false; }
    if(o.ok){ sc.log.push({who:'me',t:o.t}); sc.log.push({who:'p',t:o.r}); sc.pos++; sc.tried=new Set(); sc.first=true; speak(optBuild(o.t).plain); }
    else { sc.tried.add(+d.opt); sc.log.push({who:'p',t:pickScold()+' '+o.r}); }
    render(); scrollEnd(); return;
  }
  if(d.pick){
    if(view==='review'){ const q=S.review[S.ri]; if(q.picked) return; q.picked=d.pick; const w=W()[q.key];
      if(d.pick===q.key){ w.lvl=Math.min(w.lvl+1,6); w.due=dayKey(INTERVALS[w.lvl]); } else { w.lvl=0; w.due=dayKey(1); q.scold=pickScold(); } save(); }
    else { const q=S.quiz[S.qi]; if(q.picked) return; q.picked=d.pick; if(d.pick!==q.key){ q.scold=pickScold(); S.quiz.push(makeQ(q.key,q.type)); } }
    render(); return;
  }
  const a=d.act;
  if(a==='addp'){
    const name=(document.getElementById('pname').value||'').trim(), he=(document.getElementById('phe').value||'').trim();
    if(!name){ toast('Напиши имя — так Пнина будет к тебе обращаться.'); return; }
    const id='p'+Date.now(); state.profiles[id]=newProfile(name,he,newGender); state.active=id; save(); view='home'; render(); }
  else if(a==='export'){
    const code='PNINA1:'+btoa(unescape(encodeURIComponent(JSON.stringify({profiles:state.profiles}))));
    const ta=document.getElementById('xfer'); ta.value=code; ta.select();
    try{ navigator.clipboard.writeText(code).then(()=>toast('Код скопирован.'),()=>toast('Код в поле — скопируй его вручную.')); }catch(e){ toast('Код в поле — скопируй его вручную.'); } }
  else if(a==='import'){
    try{
      const raw=(document.getElementById('xfer').value||'').trim();
      if(!raw.startsWith('PNINA1:')) throw 0;
      const data=JSON.parse(decodeURIComponent(escape(atob(raw.slice(7))))); if(!data||typeof data.profiles!=='object') throw 0;
      let added=0, replaced=0;
      Object.values(data.profiles).forEach(p=>{
        if(!p||!p.name||!p.words) return;
        const same=Object.keys(state.profiles).find(id=>state.profiles[id].name===p.name&&state.profiles[id].gender===p.gender);
        if(same){ state.profiles[same]=Object.assign(newProfile(p.name,p.heName,p.gender),p); replaced++; }
        else { const id='p'+Date.now()+added; state.profiles[id]=Object.assign(newProfile(p.name,p.heName,p.gender),p); added++; if(!state.active) state.active=id; }
      });
      save(); render(); toast(`Готово: добавлено ${added}, обновлено ${replaced}.`);
    }catch(e){ toast('Это не похоже на код прогресса.'); } }
  else if(a==='start'){ startDay(); window.scrollTo(0,0); }
  else if(a==='reviewonly'){ S={review:shuffle(dueKeys()).map(k=>makeQ(k)),ri:0,reviewOnly:true}; view='review'; render(); }
  else if(a==='more'){ advance(); render(); scrollEnd(); }
  else if(a==='torecapend'){ afterRecap(); render(); window.scrollTo(0,0); }
  else if(a==='cards'){ view='cards'; render(); window.scrollTo(0,0); }
  else if(a==='quiz'){ S.quiz=shuffle(S.ep.items.flatMap(k=>{ const it=ITEMS[k]; return [makeQ(k,'he2ru'), makeQ(k, it.kind==='p'&&it.when?'sit':'ru2he')]; })); S.qi=0; view='quiz'; render(); window.scrollTo(0,0); }
  else if(a==='nextq'){
    if(view==='review'){ S.ri++; if(S.ri>=S.review.length){ if(S.reviewOnly){ view='home'; S=null; } else startMain(); } }
    else { S.qi++; if(S.qi>=S.quiz.length) finishDay(); }
    render(); window.scrollTo(0,0);
  }
  else if(a==='skip'){ state.offset++; save(); render(); }
  else if(a==='reset'){ if(!resetArmed){ resetArmed=true; render(); return; }
    const p=P(); Object.assign(p,{words:{},done:[],lastDone:null,scolds:[]}); resetArmed=false; save(); view='home'; S=null; render(); }
});
render();
if(window.PNINA_PWA&&'serviceWorker' in navigator&&!isNative()) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
